<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Recovery</title><link rel="stylesheet" href="portal.css"></head><body><header><h1>Account recovery</h1><a href="/">Back to login</a></header><main><section class="card"><h2>Request a password reset</h2><p>Your school administrator will verify your identity and assign a new password. Contact your school after submitting this request. Do not include passwords or sensitive documents.</p><form id="recoveryForm"><label>Username<input name="username" required maxlength="80" autocomplete="username"></label><label>Message for the administrator<textarea name="message" maxlength="1000" required placeholder="Your name, class and how the school can contact you"></textarea></label><button>Submit request</button></form><p id="status" role="status"></p></section></main><script>document.getElementById('recoveryForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/api/recovery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();document.getElementById('status').textContent=d.message||d.error;if(r.ok)e.target.reset()}catch{document.getElementById('status').textContent='Unable to connect. Please try again.'}finally{button.disabled=false}};</script><script src="accessibility.js"></script></body></html>
