<!DOCTYPE html>

<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCQ Portal - Login</title><style>

[hidden]{display:none!important}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f4f6f9;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:100px 20px 30px}.topbar{position:absolute;top:0;left:0;right:0;padding:20px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border-bottom:1px solid #e2e8f0}.brand{font-weight:700}.topbar nav{display:flex;gap:8px}.topbar a{padding:10px 18px;border-radius:8px;text-decoration:none;color:#1e40af;border:1px solid #cbd5e1}.topbar a[aria-current=page]{color:white;background:#2563eb;border-color:#2563eb}.card{background:white;padding:2rem;border-radius:14px;box-shadow:0 4px 20px #12243a12;width:min(100%,400px)}h1{font-size:1.5rem;margin:0 0 12px}.hint{color:#526176;line-height:1.6}label{display:block;margin-top:16px;font-weight:600}input,button{font:inherit;width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #b7c5d6}button{background:#2563eb;color:white;border:none;font-weight:600;cursor:pointer}.toggle{background:none;color:#1d4ed8;padding:8px;font-size:.95rem}.admin-link{display:block;text-align:center;margin-top:18px;color:#334155}#msg{line-height:1.5} @media(max-width:500px){.topbar{padding:16px;align-items:flex-start}.brand{max-width:120px}.topbar a{padding:10px 12px}}

.show-password{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-size:.95rem;font-weight:400;cursor:pointer}.show-password input{width:18px;height:18px;margin:0;padding:0;accent-color:#2563eb}</style></head><body><header class="topbar"><span class="brand">IGCSE MCQ Portal</span><nav aria-label="Choose login"><a href="/?role=student" id="studentTab">Students</a><a href="/?role=staff" id="staffTab">Staff</a></nav></header>

<main class="card"><h1 id="form-title">Student Login</h1><p class="hint" id="loginHint"></p><form id="authForm"><div id="registrationDetails" hidden><label for="fullName">Student full name</label><input id="fullName" maxlength="160" autocomplete="name"><label for="email">Email (optional)</label><input id="email" type="email" maxlength="160" autocomplete="email"><label for="studentNumber">Student / admission number (optional)</label><input id="studentNumber" maxlength="160"><label for="className">Class / section (optional)</label><input id="className" maxlength="160"></div><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><div id="twoFactorField" hidden><label for="twoFactorCode">Authenticator or recovery code</label><input id="twoFactorCode" maxlength="30" autocomplete="one-time-code"><p>Use a fresh code from your authenticator app or an unused recovery code.</p></div><label class="show-password"><input type="checkbox" id="showPassword" aria-controls="password"> Show password</label><button id="submit-btn" type="submit">Login</button></form><button class="toggle" id="toggle-text" type="button">New student? Register here</button><a class="admin-link" id="adminLink" href="/?role=admin" hidden>Administrator login</a><p><a href="/recovery.html">Forgot your password?</a></p><p id="msg" role="status"></p></main>

<script>

document.getElementById('showPassword').addEventListener('change',event=>{document.getElementById('password').type=event.target.checked?'text':'password'});

let isRegister=false;const requested=new URLSearchParams(location.search).get('role');const portal=['staff','admin'].includes(requested)?requested:'student';const title=portal==='admin'?'Administrator':portal==='staff'?'Staff':'Student';

function render(){document.getElementById('showPassword').checked=false;document.getElementById('password').type='password';document.getElementById('registrationDetails').hidden=!isRegister;document.getElementById('fullName').required=isRegister;document.querySelectorAll('#registrationDetails input').forEach(input=>input.disabled=!isRegister);document.getElementById('form-title').textContent=isRegister?'Register Student Account':title+' Login';document.getElementById('submit-btn').textContent=isRegister?'Register':'Login';document.getElementById('toggle-text').hidden=portal!=='student';document.getElementById('toggle-text').textContent=isRegister?'Already registered? Login':'New student? Register here';document.getElementById('adminLink').hidden=portal!=='staff';document.getElementById('loginHint').textContent=portal==='staff'?'Use the staff account provided by your administrator.':portal==='admin'?'Manage staff accounts, subjects and question upload access.':isRegister?'Create your student account to start topic quizzes.':'Choose a topic, take a quiz and track your marks.';document.getElementById('password').autocomplete=isRegister?'new-password':'current-password';document.getElementById(portal==='student'?'studentTab':'staffTab').setAttribute('aria-current','page')}

document.getElementById('toggle-text').onclick=()=>{isRegister=!isRegister;document.getElementById('msg').textContent='';render()};render();

document.getElementById('authForm').onsubmit=async event=>{event.preventDefault();const msg=document.getElementById('msg'),button=document.getElementById('submit-btn');button.disabled=true;try{const res=await fetch(isRegister?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value,code:document.getElementById('twoFactorCode').value.trim(),role:'student',portal,...(isRegister?{fullName:document.getElementById('fullName').value,email:document.getElementById('email').value,studentNumber:document.getElementById('studentNumber').value,className:document.getElementById('className').value}:{})})});const data=await res.json();msg.style.color=res.ok?'#166534':'#b91c1c';if(!res.ok){msg.textContent=data.error;if(data.requiresTwoFactor){document.getElementById('twoFactorField').hidden=false;document.getElementById('twoFactorCode').focus()}return}if(isRegister){isRegister=false;render();msg.textContent=data.message}else location.href=data.role==='admin'?'/admin.html':data.role==='staff'?'/teaching.html':'/student.html'}catch{msg.textContent='Unable to connect. Please try again.'}finally{button.disabled=false}};

</script><script src="accessibility.js"></script></body></html>
